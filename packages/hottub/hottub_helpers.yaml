# ============================================================
# Hot Tub Control — Helpers
# File: packages/hottub/hottub_helpers.yaml
#
# This file defines all the "virtual switches and dials" that
# the rest of the system reads and writes. Think of it as the
# control panel wiring — nothing here runs any logic itself,
# it just stores values that automations and the dashboard use.
#
# Three types of helper are defined:
#   input_number  — a numeric value you can read/write (e.g. a rate or threshold)
#   input_boolean — an on/off toggle (e.g. "is solar heating enabled?")
#   input_select  — a dropdown with a fixed list of options (e.g. current mode)
#   timer         — a countdown that fires an event when it reaches zero
#
# Included automatically via the packages block in configuration.yaml.
# ============================================================

input_number:

  # ── TARGET TEMPERATURE ─────────────────────────────────────
  # The water temperature you want the tub to reach.
  # Shown on the dashboard alongside the live reading.
  # Adjust to your preference — 38°C is a typical hot tub temperature.
  hottub_target_temp:
    name: "Hot Tub Target Temperature"
    min: 20
    max: 42
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-water
    initial: 38
    mode: slider

  # ── SOLAR THRESHOLD ────────────────────────────────────────
  # Minimum solar production (Watts) required to run the tub for free.
  # Set this to roughly match your tub's running wattage so it only
  # heats when the solar panels are producing enough to cover it.
  hottub_solar_threshold:
    name: "Hot Tub Solar Threshold"
    min: 500
    max: 6000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:solar-power
    initial: 2000
    mode: slider

  # ── OVERRIDE DURATION ──────────────────────────────────────
  # How long (hours) a dashboard-triggered manual override runs
  # before automatically turning off. The physical button on the
  # wall unit uses its own 30/60/90-minute countdown — this
  # setting only applies to overrides started from the dashboard.
  hottub_override_duration:
    name: "Hot Tub Override Duration"
    min: 0.5
    max: 8
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:timer-outline
    initial: 3
    mode: slider

  # ── OCTOPUS COSY TARIFF RATES ──────────────────────────────
  # The price per kWh at each tariff period.
  # Verify your exact rates on the Octopus dashboard / statement —
  # they vary slightly by region and contract renewal.
  # Cosy cheap windows: 04:00–07:00 / 13:00–16:00 / 22:00–00:00
  # Peak (expensive):   16:00–19:00
  hottub_rate_cheap:
    name: "Tariff — Cheap Rate (p/kWh)"
    min: 1
    max: 50
    step: 0.1
    unit_of_measurement: "p"
    icon: mdi:cash-minus
    initial: 12.0
    mode: box

  hottub_rate_standard:
    name: "Tariff — Standard Rate (p/kWh)"
    min: 1
    max: 100
    step: 0.1
    unit_of_measurement: "p"
    icon: mdi:cash
    initial: 24.0
    mode: box

  hottub_rate_peak:
    name: "Tariff — Peak Rate (p/kWh)"
    min: 1
    max: 100
    step: 0.1
    unit_of_measurement: "p"
    icon: mdi:cash-plus
    initial: 38.0
    mode: box

  # ── DAILY STORE ────────────────────────────────────────────
  # Snapshot of yesterday's usage, saved at 23:55 each night.
  # Because the energy meter resets at midnight, we grab the
  # figures just before the reset so the 8AM notification can
  # still report yesterday's numbers even though the meter has
  # already ticked over to a new day.
  hottub_yesterday_energy:
    name: "Hot Tub Yesterday Energy"
    min: 0
    max: 200
    step: 0.001
    unit_of_measurement: "kWh"
    icon: mdi:lightning-bolt
    initial: 0
    mode: box

  hottub_yesterday_cost:
    name: "Hot Tub Yesterday Cost"
    min: 0
    max: 9999
    step: 0.1
    unit_of_measurement: "p"
    icon: mdi:currency-gbp
    initial: 0
    mode: box

  # ── DAILY STORE ────────────────────────────────────────────
  # Note: the per-tariff kWh buckets (today/week/month cheap/standard/
  # peak/solar) have been removed. Energy tracking is now handled by
  # utility_meter entities defined in hottub_sensors.yaml, which track
  # kWh per tariff continuously in HA without needing the dashboard open.


input_boolean:

  # ── MASTER ON/OFF SWITCH ───────────────────────────────────
  # The global kill switch for all automatic heating.
  # Turn this OFF when the tub is empty, being serviced, or
  # you want to pause all scheduling without changing any
  # individual settings. Manual override is intentionally
  # exempt — if you tap the physical button or use the
  # dashboard override, the tub will still turn on.
  hottub_schedule_enabled:
    name: "Hot Tub Schedule Enabled"
    icon: mdi:toggle-switch

  # ── SCHEDULE TOGGLES ───────────────────────────────────────
  # Independent on/off switches for each heating mode.
  # The smart controller checks these before activating.
  # Useful if you want solar heating but NOT cheap-rate heating,
  # for example during a period where you want manual control only.

  hottub_schedule_solar:
    name: "Schedule — Solar Heating"
    icon: mdi:solar-power

  hottub_schedule_cheap:
    name: "Schedule — Cheap Rate"
    icon: mdi:cash-minus

  hottub_schedule_standard:
    name: "Schedule — Standard Rate"
    icon: mdi:cash

  # ── MANUAL OVERRIDE ────────────────────────────────────────
  # Set to ON to force the tub on immediately, regardless of
  # schedule, tariff, or time of day.
  # Set by: dashboard toggle OR physical touch sensor on wall unit.
  # Auto-cancels: via HA timer (dashboard) or OLED countdown (physical).
  hottub_in_use_override:
    name: "Hot Tub In Use Override"
    icon: mdi:hot-tub


input_select:

  # ── CURRENT MODE INDICATOR ─────────────────────────────────
  # Shows WHY the tub is currently on or off.
  # This is written by the automations — never set it manually.
  # It is "read-only" in practice and exists purely so the
  # dashboard and notifications can display a human-readable reason.
  hottub_control_mode:
    name: "Hot Tub Control Mode"
    options:
      - "Solar"
      - "Cheap Rate"
      - "Override"
      - "Peak Block"
      - "Off"
    initial: "Off"
    icon: mdi:heat-pump


timer:

  # ── DASHBOARD OVERRIDE COUNTDOWN ──────────────────────────
  # Counts down when a manual override is started from the dashboard.
  # When it reaches zero, the automation "hottub_override_expired"
  # fires: it turns the tub off and sends an iOS notification.
  # "restore: true" means the countdown survives an HA restart.
  hottub_override_timer:
    name: "Hot Tub Override Timer"
    icon: mdi:timer
    restore: true
