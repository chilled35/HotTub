# ============================================================
# Hot Tub Control — Template Sensors, Binary Sensors & Utility Meters
# File: packages/hottub/hottub_sensors.yaml
#
# Utility meters — total hot tub energy (server-side, always accurate):
#   sensor.hottub_energy_daily_cheap/standard/peak/solar   — kWh today per tariff
#   sensor.hottub_energy_weekly_cheap/standard/peak/solar  — kWh this week per tariff
#   sensor.hottub_energy_monthly_cheap/standard/peak/solar — kWh this month per tariff
#   select.hottub_energy_daily/weekly/monthly               — active tariff (switched by automation 6)
#
# Utility meters — grid deficit during solar sessions:
#   sensor.hottub_deficit_daily_cheap/standard/peak   — grid deficit kWh today by tariff
#   sensor.hottub_deficit_weekly_cheap/standard/peak  — grid deficit kWh this week by tariff
#   sensor.hottub_deficit_monthly_cheap/standard/peak — grid deficit kWh this month by tariff
#   select.hottub_deficit_daily/weekly/monthly         — active tariff (switched by automation 11)
#
# Integration sensor:
#   sensor.hot_tub_grid_deficit_energy  — cumulative kWh of grid draw during solar
#                                          (source for deficit utility meters above)
#
# Template sensors (computed from utility meters):
#   sensor.hot_tub_electricity_rate     — current p/kWh (Cosy tariff)
#   sensor.hottub_grid_deficit_power    — live grid draw during solar sessions (W)
#   sensor.hot_tub_today_total_kwh      — today's total kWh usage
#   sensor.hot_tub_today_cost           — today's cost in pence (incl. grid deficit during solar)
#   sensor.hot_tub_week_cost            — this week's cost in pence
#   sensor.hot_tub_month_cost           — this month's cost in pence
#
# Binary sensors (true/false flags):
#   binary_sensor.hot_tub_cheap_rate_active  — are we in a cheap window?
#   binary_sensor.hot_tub_peak_block_active  — are we in the 16-19 peak?
#   binary_sensor.hot_tub_solar_sufficient   — is solar output high enough?
#   binary_sensor.hot_tub_voltage_alert      — is mains voltage outside normal?
#
# Temperature comes directly from the ESPHome wall unit (not defined here):
#   sensor.hottub_temperature_temperature
#
# Cost tracking approach:
#   Main utility meters (energy_*) track total hot tub kWh bucketed by tariff.
#   During solar sessions the tariff is "solar" so that energy is zero-cost.
#   However, when tub draw exceeds solar production a grid deficit exists.
#   Deficit utility meters (deficit_*) track only that grid-import portion,
#   bucketed by time-of-day tariff (cheap/standard/peak), and the deficit cost
#   is added to the total. Solar kWh minus deficit = truly free solar energy.
# ============================================================

# ── UTILITY METERS — TOTAL HOT TUB ENERGY ──────────────────────────────────────
# Three meters (daily / weekly / monthly), each with four tariff slots.
# The active tariff is switched by automation hottub_tariff_switcher (automation 6).
# Solar takes priority: when binary_sensor.hot_tub_solar_sufficient is ON,
# the tariff is set to "solar" regardless of the time window.
utility_meter:

  hottub_energy_daily:
    source: sensor.appliance_hottub_energy
    cycle: daily
    tariffs:
      - cheap
      - standard
      - peak
      - solar

  hottub_energy_weekly:
    source: sensor.appliance_hottub_energy
    cycle: weekly
    tariffs:
      - cheap
      - standard
      - peak
      - solar

  hottub_energy_monthly:
    source: sensor.appliance_hottub_energy
    cycle: monthly
    tariffs:
      - cheap
      - standard
      - peak
      - solar

  # ── UTILITY METERS — GRID DEFICIT DURING SOLAR ─────────────────────────────
  # Source: sensor.hot_tub_grid_deficit_energy (integration of deficit power).
  # Only accumulates when solar is active and tub draw exceeds solar production.
  # Tariff switching: automation hottub_deficit_tariff_switcher (automation 11).
  # Time-of-day only — never switches to solar since these are the grid-cost portion.
  hottub_deficit_daily:
    source: sensor.hot_tub_grid_deficit_energy
    cycle: daily
    tariffs:
      - cheap
      - standard
      - peak

  hottub_deficit_weekly:
    source: sensor.hot_tub_grid_deficit_energy
    cycle: weekly
    tariffs:
      - cheap
      - standard
      - peak

  hottub_deficit_monthly:
    source: sensor.hot_tub_grid_deficit_energy
    cycle: monthly
    tariffs:
      - cheap
      - standard
      - peak

# ── INTEGRATION SENSOR — GRID DEFICIT ENERGY ────────────────────────────────────
# Integrates sensor.hottub_grid_deficit_power (W) over time to produce
# cumulative kWh. This becomes the source for the deficit utility meters above.
# Only non-zero when binary_sensor.hot_tub_solar_sufficient is ON and the tub
# is drawing more than solar is producing.
sensor:
  - platform: integration
    source: sensor.hottub_grid_deficit_power
    name: "Hot Tub Grid Deficit Energy"
    unique_id: hottub_grid_deficit_energy
    unit_prefix: k
    unit_time: h
    round: 3
    method: trapezoidal

template:
  - sensor:

      # ── ELECTRICITY RATE ───────────────────────────────────
      # Returns the current Octopus Cosy tariff rate in pence per kWh.
      # The tariff windows are:
      #   Cheap:    04:00–07:00, 13:00–16:00, 22:00–00:00
      #   Peak:     16:00–19:00  (most expensive — tub is blocked)
      #   Standard: all other hours
      #
      # Attributes:
      #   tariff     — "cheap", "peak", or "standard" (used by the dashboard)
      #   next_change — human-readable label of the next tariff boundary
      - name: "Hot Tub Electricity Rate"
        unique_id: hottub_electricity_rate
        unit_of_measurement: "p/kWh"
        icon: mdi:cash
        state: >
          {% set h = now().hour %}
          {% if (h >= 4 and h < 7) or (h >= 13 and h < 16) or h >= 22 %}
            {{ states('input_number.hottub_rate_cheap') | float(12) }}
          {% elif h >= 16 and h < 19 %}
            {{ states('input_number.hottub_rate_peak') | float(38) }}
          {% else %}
            {{ states('input_number.hottub_rate_standard') | float(24) }}
          {% endif %}
        attributes:
          tariff: >
            {% set h = now().hour %}
            {% if (h >= 4 and h < 7) or (h >= 13 and h < 16) or h >= 22 %}cheap
            {% elif h >= 16 and h < 19 %}peak
            {% else %}standard{% endif %}
          next_change: >
            {% set h = now().hour %}
            {% if h >= 0  and h < 4  %}04:00 → Cheap
            {% elif h >= 4  and h < 7  %}07:00 → Standard
            {% elif h >= 7  and h < 13 %}13:00 → Cheap
            {% elif h >= 13 and h < 16 %}16:00 → Peak ⛔
            {% elif h >= 16 and h < 19 %}19:00 → Standard
            {% elif h >= 19 and h < 22 %}22:00 → Cheap
            {% else %}00:00 → Standard{% endif %}

      # ── GRID DEFICIT POWER ─────────────────────────────────
      # The wattage being drawn from the grid during a solar session.
      # Formula: max(0, tub_power_W − solar_power_W)
      # Returns 0 when solar is not active — no deficit outside solar sessions.
      # This sensor is the source that sensor.hot_tub_grid_deficit_energy integrates.
      - name: "Hot Tub Grid Deficit Power"
        unique_id: hottub_grid_deficit_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-import
        state: >
          {% if is_state('binary_sensor.hot_tub_solar_sufficient', 'on') %}
            {% set tub_w   = states('sensor.appliance_hottub_power') | float(0) %}
            {% set solar_w = states('sensor.power_meter') | float(0) * 1000 %}
            {{ [tub_w - solar_w, 0] | max | round(1) }}
          {% else %}
            0
          {% endif %}

      # ── TODAY TOTAL kWh ────────────────────────────────────
      # Total energy consumed today (all tariff bands combined).
      # Sums the four utility meter tariff slots for today.
      - name: "Hot Tub Today Total kWh"
        unique_id: hottub_today_total_kwh
        unit_of_measurement: "kWh"
        state_class: total_increasing
        icon: mdi:lightning-bolt
        state: >
          {% set c     = states('sensor.hottub_energy_daily_cheap')    | float(0) %}
          {% set s     = states('sensor.hottub_energy_daily_standard') | float(0) %}
          {% set p     = states('sensor.hottub_energy_daily_peak')     | float(0) %}
          {% set solar = states('sensor.hottub_energy_daily_solar')    | float(0) %}
          {{ (c + s + p + solar) | round(3) }}

      # ── COST SENSORS ───────────────────────────────────────
      # Multiply utility meter kWh by the configurable tariff rates.
      # Solar kWh (solar bucket) has zero grid cost.
      # Grid deficit kWh (deficit_* buckets) is charged at the time-of-day
      # rate that was active when the deficit occurred. Divide by 100 in the
      # UI to convert pence to pounds.
      - name: "Hot Tub Today Cost"
        unique_id: hottub_today_cost
        unit_of_measurement: "p"
        state_class: total
        icon: mdi:currency-gbp
        state: >
          {% set c      = states('sensor.hottub_energy_daily_cheap')     | float(0) %}
          {% set s      = states('sensor.hottub_energy_daily_standard')  | float(0) %}
          {% set p      = states('sensor.hottub_energy_daily_peak')      | float(0) %}
          {% set dc     = states('sensor.hottub_deficit_daily_cheap')    | float(0) %}
          {% set ds     = states('sensor.hottub_deficit_daily_standard') | float(0) %}
          {% set dp     = states('sensor.hottub_deficit_daily_peak')     | float(0) %}
          {% set c_rate = states('input_number.hottub_rate_cheap')       | float(12) %}
          {% set s_rate = states('input_number.hottub_rate_standard')    | float(24) %}
          {% set p_rate = states('input_number.hottub_rate_peak')        | float(38) %}
          {{ ((c * c_rate) + (s * s_rate) + (p * p_rate) + (dc * c_rate) + (ds * s_rate) + (dp * p_rate)) | round(1) }}

      - name: "Hot Tub Week Cost"
        unique_id: hottub_week_cost
        unit_of_measurement: "p"
        state_class: total
        icon: mdi:currency-gbp
        state: >
          {% set c      = states('sensor.hottub_energy_weekly_cheap')     | float(0) %}
          {% set s      = states('sensor.hottub_energy_weekly_standard')  | float(0) %}
          {% set p      = states('sensor.hottub_energy_weekly_peak')      | float(0) %}
          {% set dc     = states('sensor.hottub_deficit_weekly_cheap')    | float(0) %}
          {% set ds     = states('sensor.hottub_deficit_weekly_standard') | float(0) %}
          {% set dp     = states('sensor.hottub_deficit_weekly_peak')     | float(0) %}
          {% set c_rate = states('input_number.hottub_rate_cheap')        | float(12) %}
          {% set s_rate = states('input_number.hottub_rate_standard')     | float(24) %}
          {% set p_rate = states('input_number.hottub_rate_peak')         | float(38) %}
          {{ ((c * c_rate) + (s * s_rate) + (p * p_rate) + (dc * c_rate) + (ds * s_rate) + (dp * p_rate)) | round(1) }}

      - name: "Hot Tub Month Cost"
        unique_id: hottub_month_cost
        unit_of_measurement: "p"
        state_class: total
        icon: mdi:currency-gbp
        state: >
          {% set c      = states('sensor.hottub_energy_monthly_cheap')     | float(0) %}
          {% set s      = states('sensor.hottub_energy_monthly_standard')  | float(0) %}
          {% set p      = states('sensor.hottub_energy_monthly_peak')      | float(0) %}
          {% set dc     = states('sensor.hottub_deficit_monthly_cheap')    | float(0) %}
          {% set ds     = states('sensor.hottub_deficit_monthly_standard') | float(0) %}
          {% set dp     = states('sensor.hottub_deficit_monthly_peak')     | float(0) %}
          {% set c_rate = states('input_number.hottub_rate_cheap')         | float(12) %}
          {% set s_rate = states('input_number.hottub_rate_standard')      | float(24) %}
          {% set p_rate = states('input_number.hottub_rate_peak')          | float(38) %}
          {{ ((c * c_rate) + (s * s_rate) + (p * p_rate) + (dc * c_rate) + (ds * s_rate) + (dp * p_rate)) | round(1) }}


  # Time-based binary sensors need explicit triggers because they
  # use only now() and have no entity dependencies — without triggers
  # HA has nothing to cause a re-evaluation after restart.
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time
        at: "04:00:00"
      - platform: time
        at: "07:00:00"
      - platform: time
        at: "13:00:00"
      - platform: time
        at: "16:00:00"
      - platform: time
        at: "19:00:00"
      - platform: time
        at: "22:00:00"
      - platform: time
        at: "00:00:00"
    binary_sensor:

      # ── CHEAP RATE ACTIVE ──────────────────────────────────
      # True during the three Octopus Cosy cheap windows.
      # The smart controller uses this to decide whether to heat.
      - name: "Hot Tub Cheap Rate Active"
        unique_id: hottub_cheap_rate_active
        device_class: power
        icon: mdi:cash-check
        state: >
          {% set h = now().hour %}
          {{ (h >= 4 and h < 7) or (h >= 13 and h < 16) or h >= 22 }}

      # ── PEAK BLOCK ACTIVE ──────────────────────────────────
      # True between 16:00 and 19:00. When true (and override is
      # off), the smart controller forces the tub off regardless
      # of any other conditions — peak electricity is ~38p/kWh.
      - name: "Hot Tub Peak Block Active"
        unique_id: hottub_peak_block_active
        device_class: safety
        icon: mdi:block-helper
        state: >
          {% set h = now().hour %}
          {{ h >= 16 and h < 19 }}

  - binary_sensor:

      # ── SOLAR SUFFICIENT ───────────────────────────────────
      # True when the solar panels are producing enough to cover
      # the tub's running load. sensor.power_meter reports in kW,
      # so we multiply by 1000 to compare against the W threshold.
      # delay_on/delay_off prevent chattering when clouds pass —
      # solar must be stable above/below threshold for 2 minutes
      # before any downstream automations (smart controller, tariff
      # switcher, solar trigger on/off) react.
      - name: "Hot Tub Solar Sufficient"
        unique_id: hottub_solar_sufficient
        device_class: power
        icon: mdi:solar-power
        delay_on:
          minutes: 2
        delay_off:
          minutes: 2
        state: >
          {% set solar_w   = states('sensor.power_meter') | float(0) * 1000 %}
          {% set threshold = states('input_number.hottub_solar_threshold') | float(2000) %}
          {{ solar_w >= threshold }}

      # ── VOLTAGE ALERT ──────────────────────────────────────
      # UK mains should be 230V ±10%, so 210–250V is normal.
      # True if the Zigbee plug reports voltage outside that band.
      # The plug must be reporting (v > 0) before the alert fires,
      # so a missing/unavailable plug won't trigger a false alarm.
      - name: "Hot Tub Voltage Alert"
        unique_id: hottub_voltage_alert
        device_class: problem
        icon: mdi:lightning-bolt-circle
        state: >
          {% set v = states('sensor.appliance_hottub_voltage') | float(0) %}
          {{ v > 0 and (v < 210 or v > 250) }}
        attributes:
          voltage: "{{ states('sensor.appliance_hottub_voltage') | float(0) }} V"
