# ============================================================
# Hot Tub Control — Core Automations
# File: /config/packages/hottub/hottub_automations.yaml
#
# Automation index:
#   1.  hottub_cheap_rate_on          Powers on at start of each cheap window
#   2.  hottub_cheap_rate_off         Powers off at end of each cheap window
#   3.  hottub_peak_block_on          Force off at 16:00 peak start
#   4.  hottub_override_start         Starts timer when override boolean ON
#   5.  hottub_override_expired       Auto-cancels override when timer expires
#   6.  hottub_tariff_switcher        Switches main energy meter tariff (incl. solar)
#   7.  hottub_smart_controller       Priority cascade — main control logic
#   8.  hottub_store_daily_totals     Snapshots usage at 23:55 for notifications
#   9.  hottub_esphome_override_on    Bridge: D1 Mini touch → HA override ON
#   10. hottub_esphome_override_off   Bridge: D1 Mini touch cancel → HA override OFF
#   11. hottub_deficit_tariff_switcher Switches deficit meter tariff (time-of-day only)
#
# MASTER GATE: input_boolean.hottub_schedule_enabled
#   All automations that power the tub ON check this first.
#   Turn it OFF when the tub is empty or being serviced.
#   Override (automations 4, 9, 10) is intentionally EXEMPT.
#
# CHEAP RATE WINDOWS — each has its own enable boolean:
#   input_boolean.hottub_schedule_cheap_0400  (04:00–07:00)
#   input_boolean.hottub_schedule_cheap_1300  (13:00–16:00)
#   input_boolean.hottub_schedule_cheap_2200  (22:00–00:00)
#
# OVERRIDE FLOW (D1 Mini touch sensor):
#   Touch tap on D1 Mini
#     → binary_sensor.hottub_temperature_override_active (ESPHome)
#       → hottub_esphome_override_on (bridge)
#         → input_boolean.hottub_in_use_override
#           → hottub_override_start
#             → switch.appliance_hottub ON + timer starts
#   Timer expires / 4th tap cancels on D1 Mini
#     → binary_sensor.hottub_temperature_override_active OFF
#       → hottub_esphome_override_off (bridge)
#         → input_boolean.hottub_in_use_override OFF
#           → switch.appliance_hottub OFF (if not in cheap/solar window)
# ============================================================

automation:

  # ══════════════════════════════════════════════════════════
  # 1. CHEAP RATE — POWER ON
  # Fires at the start of each Octopus Cosy cheap window.
  # Each window has its own trigger ID so the condition can
  # check the corresponding per-window schedule boolean.
  # Cosy windows: 04:00–07:00 / 13:00–16:00 / 22:00–00:00
  # ══════════════════════════════════════════════════════════
  - id: hottub_cheap_rate_on
    alias: "Hot Tub — Cheap Rate: Power On"
    description: >
      Powers tub on at the start of each Cosy cheap window,
      provided the master gate, the per-window boolean, and
      the tub state conditions are all satisfied.

    trigger:
      - platform: time
        at: "04:00:00"
        id: "cheap_0400"
      - platform: time
        at: "13:00:00"
        id: "cheap_1300"
      - platform: time
        at: "22:00:00"
        id: "cheap_2200"

    condition:
      - condition: state
        entity_id: input_boolean.hottub_schedule_enabled
        state: "on"
      - condition: state
        entity_id: switch.appliance_hottub
        state: "off"
      - condition: state
        entity_id: input_boolean.hottub_in_use_override
        state: "off"
      - condition: template
        value_template: >
          {% if trigger.id == 'cheap_0400' %}
            {{ is_state('input_boolean.hottub_schedule_cheap_0400', 'on') }}
          {% elif trigger.id == 'cheap_1300' %}
            {{ is_state('input_boolean.hottub_schedule_cheap_1300', 'on') }}
          {% elif trigger.id == 'cheap_2200' %}
            {{ is_state('input_boolean.hottub_schedule_cheap_2200', 'on') }}
          {% else %}false{% endif %}

    action:
      - service: switch.turn_on
        target:
          entity_id: switch.appliance_hottub

      - service: input_select.select_option
        target:
          entity_id: input_select.hottub_control_mode
        data:
          option: "Cheap Rate"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Cheap rate window started ({{ trigger.id }}). Tub powered on."

    mode: single


  # ══════════════════════════════════════════════════════════
  # 2. CHEAP RATE — POWER OFF
  # Fires at the end of each Cosy cheap window.
  # Only powers off if tub is in Cheap Rate mode.
  # ══════════════════════════════════════════════════════════
  - id: hottub_cheap_rate_off
    alias: "Hot Tub — Cheap Rate: Power Off"
    description: >
      Powers tub off at the end of each Cosy cheap window,
      but only if the tub is currently in Cheap Rate mode.

    trigger:
      - platform: time
        at: "07:00:00"
      - platform: time
        at: "16:00:00"
      - platform: time
        at: "00:00:00"

    condition:
      - condition: state
        entity_id: input_select.hottub_control_mode
        state: "Cheap Rate"
      - condition: state
        entity_id: switch.appliance_hottub
        state: "on"

    action:
      - service: switch.turn_off
        target:
          entity_id: switch.appliance_hottub

      - service: input_select.select_option
        target:
          entity_id: input_select.hottub_control_mode
        data:
          option: "Off"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Cheap rate window ended. Tub powered off."

    mode: single


  # ══════════════════════════════════════════════════════════
  # 3. PEAK BLOCK — FORCE OFF
  # Cosy peak 16:00–19:00 carries a penalty rate (~38p/kWh).
  # Force the tub off at 16:00 regardless of mode, UNLESS
  # override is active (that is a deliberate user decision).
  # ══════════════════════════════════════════════════════════
  - id: hottub_peak_block_on
    alias: "Hot Tub — Peak Block: Force Off at 16:00"
    description: >
      Forces tub off at start of Cosy peak period (16:00–19:00).
      Override is exempt — that is a conscious user choice.

    trigger:
      - platform: time
        at: "16:00:00"

    condition:
      - condition: state
        entity_id: switch.appliance_hottub
        state: "on"
      - condition: state
        entity_id: input_boolean.hottub_in_use_override
        state: "off"

    action:
      - service: switch.turn_off
        target:
          entity_id: switch.appliance_hottub

      - service: input_select.select_option
        target:
          entity_id: input_select.hottub_control_mode
        data:
          option: "Peak Block"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Peak rate period started (16:00). Tub forced off."

    mode: single


  # ══════════════════════════════════════════════════════════
  # 4. OVERRIDE — START TIMER
  # When override boolean is activated, turn the tub on
  # immediately and start the auto-cancel timer.
  # Schedule gate does NOT apply — override is always deliberate.
  # ══════════════════════════════════════════════════════════
  - id: hottub_override_start
    alias: "Hot Tub — Override: Start"
    description: >
      When override is turned on: power the tub on, set mode,
      start the auto-cancel timer.

    trigger:
      - platform: state
        entity_id: input_boolean.hottub_in_use_override
        to: "on"

    action:
      - service: switch.turn_on
        target:
          entity_id: switch.appliance_hottub

      - service: input_select.select_option
        target:
          entity_id: input_select.hottub_control_mode
        data:
          option: "Override"

      - service: timer.start
        target:
          entity_id: timer.hottub_override_timer
        data:
          duration:
            hours: "{{ states('input_number.hottub_override_duration') | int(3) }}"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: >
            Override activated. Tub on for
            {{ states('input_number.hottub_override_duration') }} hours.

    mode: single


  # ══════════════════════════════════════════════════════════
  # 5. OVERRIDE — TIMER EXPIRED (AUTO-CANCEL)
  # When the override timer fires, cancel the override and
  # power off the tub. Sends iOS push notification.
  # ══════════════════════════════════════════════════════════
  - id: hottub_override_expired
    alias: "Hot Tub — Override: Auto-Cancel on Timer Expiry"
    description: >
      Automatically cancels the override and powers the tub off
      when the countdown timer finishes.

    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hottub_override_timer

    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hottub_in_use_override

      - service: switch.turn_off
        target:
          entity_id: switch.appliance_hottub

      - service: input_select.select_option
        target:
          entity_id: input_select.hottub_control_mode
        data:
          option: "Off"

      # ⚠️ Update notify service name to match your iOS device
      - service: notify.mobile_app_jasons_iphone
        data:
          title: "🛁 Hot Tub Override Ended"
          message: >
            Override finished after
            {{ states('input_number.hottub_override_duration') | float | round(1) }}h.
            Returning to smart control.
          data:
            push:
              sound: default
            url: /local/hottub/dashboard.html

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Override timer expired. Tub powered off automatically."

    mode: single


  # ══════════════════════════════════════════════════════════
  # 6. TARIFF SWITCHER
  # Switches utility meter active tariff at each Cosy boundary
  # and when solar production crosses the sufficient threshold.
  #
  # Solar takes priority over time-of-day tariff:
  #   - When binary_sensor.hot_tub_solar_sufficient goes ON
  #     → all meters switch to "solar" (zero grid cost)
  #   - When it goes OFF → revert to the current time window
  #   - At time boundaries → stay on "solar" if solar is active,
  #     otherwise switch to the boundary tariff
  #   - On HA startup → check solar first, then fall back to time
  #
  # This ensures energy drawn while solar is producing ≥ threshold
  # is recorded in the solar bucket (zero cost) rather than being
  # charged at cheap or standard rates.
  # ══════════════════════════════════════════════════════════
  - id: hottub_tariff_switcher
    alias: "Hot Tub — Tariff Switcher"
    description: >
      Switches utility meter tariff at each Cosy period boundary,
      when solar sufficient state changes, and on HA startup.
      Solar always takes priority over the time-of-day tariff.
    mode: single

    trigger:
      - platform: time
        at: "00:00:00"
        id: "standard"
      - platform: time
        at: "04:00:00"
        id: "cheap"
      - platform: time
        at: "07:00:00"
        id: "standard"
      - platform: time
        at: "13:00:00"
        id: "cheap"
      - platform: time
        at: "16:00:00"
        id: "peak"
      - platform: time
        at: "19:00:00"
        id: "standard"
      - platform: time
        at: "22:00:00"
        id: "cheap"
      - platform: homeassistant
        event: start
        id: "startup"
      - platform: state
        entity_id: binary_sensor.hot_tub_solar_sufficient
        to: "on"
        id: "solar"
      - platform: state
        entity_id: binary_sensor.hot_tub_solar_sufficient
        to: "off"
        id: "solar_off"

    action:
      - variables:
          tariff: >
            {% macro time_tariff() %}
              {% set h = now().hour %}
              {% if h >= 16 and h < 19 %}peak
              {% elif (h >= 4 and h < 7) or (h >= 13 and h < 16) or h >= 22 %}cheap
              {% else %}standard{% endif %}
            {% endmacro %}
            {% if trigger.id == 'solar' %}
              solar
            {% elif trigger.id == 'solar_off' %}
              {{ time_tariff() }}
            {% elif trigger.id == 'startup' %}
              {% if is_state('binary_sensor.hot_tub_solar_sufficient', 'on') %}solar
              {% else %}{{ time_tariff() }}{% endif %}
            {% else %}
              {# Time boundary — solar stays active if currently sufficient #}
              {% if is_state('binary_sensor.hot_tub_solar_sufficient', 'on') %}solar
              {% else %}{{ trigger.id }}{% endif %}
            {% endif %}

      - service: select.select_option
        target:
          entity_id:
            - select.hottub_energy_daily
            - select.hottub_energy_weekly
            - select.hottub_energy_monthly
        data:
          option: "{{ tariff }}"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Tariff switcher: set to {{ tariff }} (trigger: {{ trigger.id }})."


  # ══════════════════════════════════════════════════════════
  # 7. SMART HEATING CONTROLLER (PRIORITY CASCADE)
  # Runs every 5 min and on key state changes.
  # Priority order:
  #   1. Peak Block (16:00–19:00) — force OFF unless override active
  #   2. Override ON              — force ON (schedule gate exempt)
  #   3. Solar sufficient         — turn ON (sched_enabled + solar_sched)
  #   4. Cheap rate active        — turn ON (sched_enabled + per-window bool)
  #   5. Default                  — turn OFF
  #
  # cheap_sched is computed from the current hour to select the
  # correct per-window boolean (0400 / 1300 / 2200).
  # ══════════════════════════════════════════════════════════
  - id: hottub_smart_controller
    alias: "Hot Tub — Smart Heating Controller"
    description: >
      Evaluates conditions every 5 min and on key state changes.
      Updates switch.appliance_hottub and input_select.hottub_control_mode.
    mode: single
    max_exceeded: silent

    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id: input_boolean.hottub_in_use_override
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: input_boolean.hottub_schedule_enabled
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: input_boolean.hottub_schedule_cheap_0400
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: input_boolean.hottub_schedule_cheap_1300
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: input_boolean.hottub_schedule_cheap_2200
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: input_boolean.hottub_schedule_solar
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: binary_sensor.hot_tub_cheap_rate_active
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: binary_sensor.hot_tub_peak_block_active
        not_to:
          - unavailable
          - unknown
      - platform: state
        entity_id: binary_sensor.hot_tub_solar_sufficient
        not_to:
          - unavailable
          - unknown

    condition: []

    action:
      - variables:
          override:      "{{ is_state('input_boolean.hottub_in_use_override', 'on') }}"
          sched_enabled: "{{ is_state('input_boolean.hottub_schedule_enabled', 'on') }}"
          peak_block:    "{{ is_state('binary_sensor.hot_tub_peak_block_active', 'on') }}"
          cheap_rate:    "{{ is_state('binary_sensor.hot_tub_cheap_rate_active', 'on') }}"
          solar_ok:      "{{ is_state('binary_sensor.hot_tub_solar_sufficient', 'on') }}"
          solar_sched:   "{{ is_state('input_boolean.hottub_schedule_solar', 'on') }}"
          # Check the boolean for whichever cheap window is currently active
          cheap_sched: >
            {% set h = now().hour %}
            {% if h >= 4 and h < 7 %}
              {{ is_state('input_boolean.hottub_schedule_cheap_0400', 'on') }}
            {% elif h >= 13 and h < 16 %}
              {{ is_state('input_boolean.hottub_schedule_cheap_1300', 'on') }}
            {% elif h >= 22 %}
              {{ is_state('input_boolean.hottub_schedule_cheap_2200', 'on') }}
            {% else %}false{% endif %}

      - choose:

          # ── PRIORITY 1: PEAK BLOCK (override exempt) ─────────
          - conditions:
              - condition: template
                value_template: "{{ peak_block and not override }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.appliance_hottub
              - service: input_select.select_option
                target:
                  entity_id: input_select.hottub_control_mode
                data:
                  option: "Peak Block"

          # ── PRIORITY 2: OVERRIDE (schedule gate exempt) ────
          - conditions:
              - condition: template
                value_template: "{{ override }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.appliance_hottub
              - service: input_select.select_option
                target:
                  entity_id: input_select.hottub_control_mode
                data:
                  option: "Override"

          # ── PRIORITY 3: SOLAR ──────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ solar_ok and solar_sched and sched_enabled and not peak_block }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.appliance_hottub
              - service: input_select.select_option
                target:
                  entity_id: input_select.hottub_control_mode
                data:
                  option: "Solar"

          # ── PRIORITY 4: CHEAP RATE ─────────────────────
          - conditions:
              - condition: template
                value_template: "{{ cheap_rate and cheap_sched and sched_enabled and not peak_block }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.appliance_hottub
              - service: input_select.select_option
                target:
                  entity_id: input_select.hottub_control_mode
                data:
                  option: "Cheap Rate"

        # ── DEFAULT: OFF ───────────────────────────────
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.appliance_hottub
          - service: input_select.select_option
            target:
              entity_id: input_select.hottub_control_mode
            data:
              option: "Off"


  # ══════════════════════════════════════════════════════════
  # 8. STORE DAILY TOTALS (23:55)
  # ══════════════════════════════════════════════════════════
  - id: hottub_store_daily_totals
    alias: "Hot Tub — Store Daily Totals (23:55)"
    description: "Captures daily kWh and cost before midnight reset."

    trigger:
      - platform: time
        at: "23:55:00"

    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hottub_yesterday_energy
        data:
          value: "{{ states('sensor.hot_tub_today_total_kwh') | float(0) | round(3) }}"

      - service: input_number.set_value
        target:
          entity_id: input_number.hottub_yesterday_cost
        data:
          value: "{{ states('sensor.hot_tub_today_cost') | float(0) | round(1) }}"

    mode: single


  # ══════════════════════════════════════════════════════════
  # 9. ESPHOME BRIDGE — OVERRIDE ON
  # ══════════════════════════════════════════════════════════
  - id: hottub_esphome_override_on
    alias: "Hot Tub — ESPHome Bridge: Override On"
    description: >
      When the D1 Mini override sensor goes ON (touch tap),
      turn on the tub immediately and set the override boolean.

    trigger:
      - platform: state
        entity_id: binary_sensor.hottub_temperature_override_active
        to: "on"
        not_from:
          - unavailable
          - unknown

    action:
      - service: switch.turn_on
        target:
          entity_id: switch.appliance_hottub
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hottub_in_use_override

    mode: single


  # ══════════════════════════════════════════════════════════
  # 10. ESPHOME BRIDGE — OVERRIDE OFF
  # ══════════════════════════════════════════════════════════
  - id: hottub_esphome_override_off
    alias: "Hot Tub — ESPHome Bridge: Override Off"
    description: >
      When the D1 Mini override sensor goes OFF,
      clear the override boolean. Smart controller re-evaluates
      immediately and turns tub off if outside cheap/solar window.

    trigger:
      - platform: state
        entity_id: binary_sensor.hottub_temperature_override_active
        to: "off"
        not_from:
          - unavailable
          - unknown

    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.hottub_in_use_override

    mode: single


  # ══════════════════════════════════════════════════════════
  # 11. DEFICIT TARIFF SWITCHER
  # Switches the deficit utility meter tariff at each Cosy
  # time boundary and on HA startup. Time-of-day only — never
  # switches to solar, because the deficit meters track the
  # grid-cost portion of energy drawn during solar sessions.
  # Solar kWh minus deficit kWh = truly free solar energy.
  # ══════════════════════════════════════════════════════════
  - id: hottub_deficit_tariff_switcher
    alias: "Hot Tub — Deficit Tariff Switcher"
    description: >
      Switches deficit utility meter tariff at each Cosy boundary
      and on HA startup. Uses time-of-day tariff only (never solar)
      so grid deficit kWh is always charged at the correct grid rate.
    mode: single

    trigger:
      - platform: time
        at: "00:00:00"
        id: "standard"
      - platform: time
        at: "04:00:00"
        id: "cheap"
      - platform: time
        at: "07:00:00"
        id: "standard"
      - platform: time
        at: "13:00:00"
        id: "cheap"
      - platform: time
        at: "16:00:00"
        id: "peak"
      - platform: time
        at: "19:00:00"
        id: "standard"
      - platform: time
        at: "22:00:00"
        id: "cheap"
      - platform: homeassistant
        event: start
        id: "startup"

    action:
      - variables:
          tariff: >
            {% if trigger.id == 'startup' %}
              {% set h = now().hour %}
              {% if h >= 16 and h < 19 %}peak
              {% elif (h >= 4 and h < 7) or (h >= 13 and h < 16) or h >= 22 %}cheap
              {% else %}standard{% endif %}
            {% else %}
              {{ trigger.id }}
            {% endif %}

      - service: select.select_option
        target:
          entity_id:
            - select.hottub_deficit_daily
            - select.hottub_deficit_weekly
            - select.hottub_deficit_monthly
        data:
          option: "{{ tariff }}"

      - service: logbook.log
        data:
          name: "Hot Tub"
          message: "Deficit tariff switcher: set to {{ tariff }} (trigger: {{ trigger.id }})."
