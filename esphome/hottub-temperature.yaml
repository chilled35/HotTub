# ============================================================
# Hot Tub Temperature + OLED + Touch Sensor — ESPHome Config
# Hardware: Wemos D1 Mini + DS18B20 + SSD1309 2.42" OLED + TTP223 Touch
#
# WIRING:
#   DS18B20:     VCC→3.3V  GND→GND  DATA→D5  (+4.7kΩ pull-up to 3.3V)
#   SSD1309:     VCC→3.3V  GND→GND  SDA→D2   SCL→D1
#   Touch (TTP223): VCC→3.3V  GND→GND  SIG→D6
#
# GPIO MAP (silkscreen → GPIO):
#   D1 = GPIO5  (I2C SCL)
#   D2 = GPIO4  (I2C SDA)
#   D5 = GPIO14 (DS18B20 data)
#   D6 = GPIO12 (touch sensor signal)
#   D7 = GPIO13 (spare)
#
# DISPLAY MODES:
#   STANDBY  — temperature fills the screen as large as possible
#   OVERRIDE — HH:MM:SS countdown fills the screen; tap to extend; 4th tap cancels
#
# OVERRIDE LOGIC:
#   Tap 1: 0  → 30 min (1800s) — activates override, switches to countdown screen
#   Tap 2: 30 → 60 min (3600s)
#   Tap 3: 60 → 90 min (5400s) — maximum
#   Tap 4: CANCEL — resets to 0, reverts to standby
#   Auto-expires when countdown reaches 0
# ============================================================

esphome:
  name: hottub-temperature
  friendly_name: Hottub Temperature

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP avoids DHCP churn and keeps the HA integration stable.
  manual_ip:
    static_ip: 192.168.0.38
    gateway: 192.168.0.1
    subnet: 255.255.0.0
  # Fallback hotspot — if the D1 Mini can't reach the main WiFi it
  # creates its own AP so you can still connect and diagnose it.
  ap:
    ssid: "Hottub Fallback"
    password: !secret esp_fallback_password   # add to secrets.yaml

# captive_portal: shows a config page when connected to the fallback AP
captive_portal:
# logger: streams debug output over USB / network for troubleshooting
logger:
# api: enables the native Home Assistant integration (no MQTT needed)
api:
# ota: enables wireless firmware updates — password protects the endpoint
ota:
  platform: esphome
  password: !secret ota_password   # add to secrets.yaml

# ── Time (from Home Assistant — no internet lookup needed) ───────────────────
time:
  - platform: homeassistant
    id: ha_time

# ── I2C for SSD1309 OLED (D1=SCL, D2=SDA) ────────────────────────────────────
i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1
  scan: true
  id: bus_a
  frequency: 400kHz

# ── DS18B20 OneWire on D5 ─────────────────────────────────────────────────────
one_wire:
  - platform: gpio
    pin:
      number: GPIO14  # D5
      mode:
        input: true
        pullup: true

# ── Globals ───────────────────────────────────────────────────────────────────
# Global variables persist across lambda (C++) calls within one power cycle.
# "restore_value: false" means they reset to initial_value on reboot —
# intentional here so a reboot cancels any active override cleanly.
globals:
  # Counts down from 1800/3600/5400 seconds to zero. Zero means inactive.
  - id: override_seconds
    type: int
    restore_value: false
    initial_value: '0'
  # How many times the button has been tapped in the current override session.
  # Tap 1=30min, Tap 2=60min, Tap 3=90min (max), Tap 4=cancel.
  - id: tap_count
    type: int
    restore_value: false
    initial_value: '0'
  # Remembers whether override was active on the previous 1-second tick.
  # Lets us detect the exact moment the countdown transitions to zero
  # so we only trigger the "override ended" action once, not every second.
  - id: override_was_active
    type: bool
    restore_value: false
    initial_value: 'false'

# ── Temperature Sensor ────────────────────────────────────────────────────────
sensor:
  - platform: dallas_temp
    address: 0x9f0000006a642628
    name: "Temperature"
    id: hottub_temp
    update_interval: 30s
    filters:
      - filter_out: nan          # discard checksum-failed readings; hold last valid value

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s

# ── Touch Sensor on D6 (GPIO12) ───────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12  # D6
      mode: INPUT
      inverted: true
    name: "Touch Sensor"
    id: touch_button
    filters:
      - delayed_on: 20ms
      - delayed_off: 200ms
    on_press:
      then:
        - lambda: |-
            const int INCREMENT = 1800;
            const int MAX_TAPS  = 3;
            const int MAX_SECS  = INCREMENT * MAX_TAPS;

            bool was_active = (id(override_seconds) > 0);

            if (was_active) {
              if (id(tap_count) >= MAX_TAPS) {
                // 4th tap: cancel
                id(override_seconds) = 0;
                id(tap_count) = 0;
              } else {
                id(override_seconds) += INCREMENT;
                if (id(override_seconds) > MAX_SECS) id(override_seconds) = MAX_SECS;
                id(tap_count) += 1;
              }
            } else {
              // First tap — start override
              id(override_seconds) = INCREMENT;
              id(tap_count) = 1;
            }

        # State change of override_active_sensor is picked up by HA automation.
        # No service calls needed — sensor state is what the native API pushes reliably.

  # ── Override Active — HA watches this sensor state to fire automations ───────
  # Transitions OFF→ON when first tap sets override_seconds > 0
  # Transitions ON→OFF when countdown expires or 4th tap cancels
  - platform: template
    name: "Override Active"
    id: override_active_sensor
    lambda: 'return id(override_seconds) > 0;'

# ── Countdown: decrement every second while active ────────────────────────────
# This interval fires every second and is the heartbeat of the override logic.
# It decrements the countdown and keeps the OLED display ticking.
# The override_active_sensor derives its state from override_seconds, so when
# it hits zero the sensor flips to OFF, which Home Assistant detects and
# triggers the "override off" bridge automation.
interval:
  - interval: 1s
    then:
      - lambda: |-
          bool was_active = id(override_was_active);
          bool is_active  = (id(override_seconds) > 0);

          if (is_active) {
            id(override_seconds) -= 1;
            if (id(override_seconds) == 0) {
              id(tap_count) = 0;  // reset tap counter when countdown expires
            }
          }

          // Track transition: active → expired.
          // We only want to react once at the exact tick when the countdown
          // reaches zero, not on every subsequent idle tick.
          if (was_active && id(override_seconds) == 0) {
            id(override_was_active) = false;
          } else if (is_active) {
            id(override_was_active) = true;
          }

      # override_active_sensor re-evaluates its lambda each second automatically.
      # HA watches the resulting state change — no explicit service call needed.

# ── Fonts ─────────────────────────────────────────────────────────────────────
# ConsiderMeVexed by Chequered Ink — not on Google Fonts, must be local.
# Download from https://www.fontspace.com/considermevexed-font-f19295
# Place the .ttf file at: /config/esphome/fonts/ConsidermevexedRegular-ExLe.ttf
#
# font_main fills the screen for both temperature and HH:MM:SS countdown.
# Size 78 chosen to maximise vertical fill on 128×64.
# Adjust up/down if the font clips or has too much margin.
font:
  - file: "fonts/ConsidermevexedRegular-ExLe.ttf"
    id: font_main
    size: 78

# ── SSD1309 Display ───────────────────────────────────────────────────────────
# Note: SSD1309 uses the SSD1306 driver in ESPHome.
# If display is blank: try address 0x3D, check i2c scan log.
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_display
    update_interval: 1s    # 1s refresh keeps countdown accurate
    lambda: |-
      it.fill(COLOR_OFF);

      // ─────────────────────────────────────────────────────────────
      // OVERRIDE MODE — HH:MM:SS fills screen
      // Always fixed-width format so digits never shift position.
      // ─────────────────────────────────────────────────────────────
      if (id(override_seconds) > 0) {

        int total = id(override_seconds);
        int h   = total / 3600;
        int m   = (total % 3600) / 60;
        int sec = total % 60;
        char buf[12];
        snprintf(buf, sizeof(buf), "%02d:%02d:%02d", h, m, sec);
        it.print(64, 0, id(font_main), TextAlign::TOP_CENTER, buf);

      // ─────────────────────────────────────────────────────────────
      // STANDBY MODE — temperature fills screen as large as possible
      // ─────────────────────────────────────────────────────────────
      } else {

        if (id(hottub_temp).has_state()) {
          char tbuf[8];
          snprintf(tbuf, sizeof(tbuf), "%.1f", id(hottub_temp).state);
          it.print(64, 0, id(font_main), TextAlign::TOP_CENTER, tbuf);
        } else {
          it.print(64, 0, id(font_main), TextAlign::TOP_CENTER, "--.-");
        }

      }
